name: Go

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.5"

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o example-linux-amd64
          GOOS=linux GOARCH=arm64 go build -o example-linux-arm64
          GOOS=darwin GOARCH=amd64 go build -o example-darwin-amd64
